# Configuración de despliegue en Netlify

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requiere Node 20.19+ o 22.12+; fijarlo evita sorpresas en el build.
  NODE_VERSION = "22"

# 1. Redirige las llamadas /api al backend FastAPI desplegado en Render.
#    Si creas el servicio con otro nombre en Render, actualiza el host de "to"
#    (o define VITE_API_URL en Netlify para llamar a Render directamente).
[[redirects]]
  from = "/api/*"
  to = "https://urban-clothes-api.onrender.com/api/:splat"
  status = 200
  force = true

# 2. Fallback SPA: permite abrir rutas directas como /colecciones o /perfil
#    sin que Netlify dé 404 (React Router las resuelve en el navegador)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
